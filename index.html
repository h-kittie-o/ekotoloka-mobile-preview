<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Екотолока — мобільна версія</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --frame: #1c1c1e;
      --frame-edge: #2c2c2e;
      --bg: #faf1e8;
      --green: #327a40;
      --text: #1a2e1f;
      --muted: #4a5750;
      /* Логічний розмір екрана iPhone 14 (390×844 pt) */
      --screen-w: 390px;
      --screen-h: 844px;
      --bezel: 14px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 600px at 50% -10%, #fff8ef 0%, rgba(255,248,239,0) 60%),
        var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px 16px 36px;
    }

    .title {
      text-align: center;
    }
    .title h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 4vw, 28px);
      margin: 0 0 4px;
      color: var(--green);
      letter-spacing: -0.01em;
    }
    .title p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    /* ===== iPhone-мокап ===== */
    .phone {
      position: relative;
      width: calc(var(--screen-w) + var(--bezel) * 2);
      height: calc(var(--screen-h) + var(--bezel) * 2);
      max-height: calc(100dvh - 150px);
      aspect-ratio: calc(var(--screen-w) + var(--bezel) * 2) / calc(var(--screen-h) + var(--bezel) * 2);
      background: linear-gradient(160deg, #3a3a3c 0%, var(--frame) 40%, #161618 100%);
      border-radius: 58px;
      padding: var(--bezel);
      box-shadow:
        0 2px 0 1px var(--frame-edge) inset,
        0 0 0 2px #0a0a0a,
        0 40px 80px -24px rgba(20, 40, 25, 0.45),
        0 16px 40px -20px rgba(0, 0, 0, 0.5);
    }

    /* Бічні кнопки */
    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      background: #0e0e10;
      border-radius: 2px;
    }
    .phone::before { /* перемикач беззвучного + гучність */
      left: -3px;
      top: 120px;
      width: 3px;
      height: 26px;
      box-shadow: 0 44px 0 #0e0e10, 0 90px 0 #0e0e10;
    }
    .phone::after { /* кнопка живлення */
      right: -3px;
      top: 170px;
      width: 3px;
      height: 64px;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 46px;
      overflow: hidden;
      background: var(--bg);
    }

    .screen iframe {
      width: var(--screen-w);
      height: var(--screen-h);
      border: 0;
      display: block;
      /* Якщо рамка масштабується на малих екранах — лишаємо логічний розмір */
    }

    /* Dynamic Island */
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 33px;
      background: #000;
      border-radius: 20px;
      z-index: 5;
      pointer-events: none;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
    }
    .hint a { color: var(--green); }

    /* На вузьких/низьких екранах трохи зменшуємо рамку, щоб влізла */
    @media (max-height: 920px) {
      :root { --screen-h: 760px; }
    }
    @media (max-height: 820px) {
      :root { --screen-h: 680px; }
    }
    @media (max-width: 460px) {
      :root { --screen-w: 340px; --bezel: 11px; }
      .phone { border-radius: 48px; }
      .screen { border-radius: 38px; }
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Екотолока</h1>
    <p>Мобільна версія сайту</p>
  </div>

  <div class="phone" role="img" aria-label="Мокап iPhone з мобільною версією сайту Екотолока">
    <div class="screen">
      <div class="island"></div>
      <iframe
        src="https://h-kittie-o.github.io/ekotoloka-prototype/"
        title="Екотолока — мобільна версія"
        loading="eager"
        allow="clipboard-write; web-share"></iframe>
    </div>
  </div>

  <p class="hint">
    Це живий сайт у рамці айфона. Навігація — клікай всередині екрана.<br>
    Відкрити повну версію:
    <a href="https://h-kittie-o.github.io/ekotoloka-prototype/" target="_blank" rel="noopener">h-kittie-o.github.io/ekotoloka-prototype</a>
  </p>
</body>
</html>
